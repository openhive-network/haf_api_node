# L2 framework: temporal L1 authority tracking + the L2 transaction driver (always syncs from genesis)
# One of the lite HAF apps (profiles `apps` and `lite`): l2_framework -> lite_account ->
# lite_posts; the `lite` profile adds the gateway. See .env.example ("Lite accounts").
# haf_block_explorer also depends on l2_framework (it reads account authorities from the
# l2.authority_* tables), so both services also carry the `hafbe` profile.
services:
  l2-framework-install:
    image: ${L2_FRAMEWORK_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/l2_framework/l2-framework}:${L2_FRAMEWORK_VERSION:-latest}
    profiles:
      - lite
      - apps
      - l2-framework
      - hafbe
    environment:
      POSTGRES_HOST: haf
    networks:
      haf-network:
    command:
      - install_app
      - --is_forking=${L2_FRAMEWORK_IS_FORKING:-${IS_FORKING:-TRUE}}
    depends_on:
      haf:
        condition: service_healthy
  l2-framework-block-processing:
    image: ${L2_FRAMEWORK_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/l2_framework/l2-framework}:${L2_FRAMEWORK_VERSION:-latest}
    profiles:
      - lite
      - apps
      - l2-framework
      - hafbe
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: l2_framework_owner
      # block-processing log, kept in the datadir (survives compose down; rotated by the logrotate service)
      LOG_FILE: /logs/l2_framework_block_processing.log
    volumes:
      - type: bind
        source: ${HAF_LOG_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}/logs}/apps
        target: /logs
    networks:
      haf-network:
    restart: on-failure
    command:
      - process_blocks
    depends_on:
      haf:
        condition: service_healthy
      l2-framework-install:
        condition: service_completed_successfully
