# PostgreSQL connection limit for the full app set.
#
# haf_base.yaml bind-mounts this file into the datadir's haf_postgresql_conf.d,
# so every node picks it up when the haf container starts; it is not copied by
# create_directories.sh / create_zfs_datasets.sh like pgtune.conf. Changing
# max_connections needs a PostgreSQL restart: `docker compose up -d` recreates
# the haf container once for the new mount. After editing this file, run
# `docker compose up -d --force-recreate haf`: a file bind mount keeps the
# inode it was started with, so a plain restart may still see the old file.
#
# To use another value, set max_connections in a haf_postgresql_conf.d file
# whose name sorts after "connections.conf" (pgtune.conf, zfs.conf,
# custom_postgres.conf, ...): PostgreSQL reads the directory in file-name order
# and the last setting wins.
#
# Budget, profiles core admin servers apps ui hafsql haf-stats haf-fyp
# monitoring, stock settings. Steady = live sync; peak = install, massive-sync
# finalization, index builds, vacuum.
#
#                                                         steady  peak
#   pgbouncer (all PostgREST pools, agent checks,           30     30
#     shed poller; capped by PGBOUNCER_MAX_DB_CONNECTIONS)
#   hived sql_serializer + haf_maintainer + entrypoint       3     16
#     psql (replay: 5 operation + 2 transaction + 2
#     account-operation writers plus single-table
#     writers; then one per table rebuilding indexes)
#   hivemind-block-processing (index restore: 14 tables      2     16
#     at once; vacuum 4, vote workers 4)
#   hafsql                                                   8      8
#   haf_fyp: block processing 1, ranker 1, api pool 5        3      7
#   haf_stats block processing                               1      1
#     (HAF_STATS_SYNC_PARALLELISM, default 1)
#   other block processors: block explorer, reputation       8      8
#     tracker, nft tracker, hivesense-sync, l2-framework,
#     lite account/posts/social
#   one-shot installers                                      0      4
#   pghero, pgadmin, postgresexporter                        3      6
#   interactive psql / operator maintenance                  0      5
#                                                          ----   ----
#                                                            58    101
#
# Headroom: 101 + 50% = 152. The budget also leaves room for 27 more from
# tuning in .env (PGBOUNCER_MAX_DB_CONNECTIONS 30 -> 50, as in .env.example's
# worked example; HAF_STATS_SYNC_PARALLELISM 1 -> 8): 128 + 50% = 192, rounded
# up to 200. The documented peak is then about 50%
# of max_connections, under the 80% the stack should stay below. Opt-in extras
# outside this budget: postgres-public's pgbouncer (HAFSQL_PUBLIC_CONNECTION_LIMIT,
# 5) and hivesense in local mode (HIVESENSE_WORKERS, 16).
#
# Memory on a 121 GB host (shared_buffers 48GB, sized from RAM by
# postgresql_memory.sh; pgtune.conf: work_mem 64MB): the limit itself reserves
# only a few MB of shared memory per 100 slots (lock table, process slots).
# Each open backend costs a few MB of private memory, about 2 GB for 200, and
# only a running query uses work_mem (64MB per sort, 128MB per hash with
# hash_mem_multiplier 2). The ~70 queries that can run at once at peak (30
# through pgbouncer, ~40 direct) take 4.5-9 GB, so backends peak at about
# 11 GB, taken from what reduce_writebacks.sh leaves outside shared buffers and
# the ZFS ARC (10 GB safety margin, 12 GB for dirty pages).
max_connections = 200
