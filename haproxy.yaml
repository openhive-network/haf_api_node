services:
  haproxy:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/haproxy:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - servers
      - haproxy
    environment:
      SYNC_BROADCAST_BACKEND_SERVER: "${SYNC_BROADCAST_BACKEND_SERVER:-api.hive.blog}"
      SYNC_BROADCAST_BACKEND_PORT: "${SYNC_BROADCAST_BACKEND_PORT:-443}"
      SYNC_BROADCAST_BACKEND_SSL: "${SYNC_BROADCAST_BACKEND_SSL:-ssl}"
      # Static per-server concurrency caps + shed-fast queue timeout for the
      # postgrest-backed backends (see haproxy/00-global.cfg for the defaults'
      # rationale). If you override a *_SERVER_MAXCONN, keep the matching
      # *_SHED_MAXCONNS "normal" value (haproxy-healthchecks below) in sync.
      HIVEMIND_SERVER_MAXCONN: "${HIVEMIND_SERVER_MAXCONN:-64}"
      HAFAH_SERVER_MAXCONN: "${HAFAH_SERVER_MAXCONN:-48}"
      BALANCE_TRACKER_SERVER_MAXCONN: "${BALANCE_TRACKER_SERVER_MAXCONN:-32}"
      BLOCK_EXPLORER_SERVER_MAXCONN: "${BLOCK_EXPLORER_SERVER_MAXCONN:-32}"
      REPUTATION_TRACKER_SERVER_MAXCONN: "${REPUTATION_TRACKER_SERVER_MAXCONN:-32}"
      HIVESENSE_SERVER_MAXCONN: "${HIVESENSE_SERVER_MAXCONN:-32}"
      NFT_TRACKER_SERVER_MAXCONN: "${NFT_TRACKER_SERVER_MAXCONN:-32}"
      HAF_STATS_SERVER_MAXCONN: "${HAF_STATS_SERVER_MAXCONN:-32}"
      HAF_FYP_SERVER_MAXCONN: "${HAF_FYP_SERVER_MAXCONN:-32}"
      HAF_FYP_ADMIN_SERVER_MAXCONN: "${HAF_FYP_ADMIN_SERVER_MAXCONN:-16}"
      PROXY_WHITELIST_SERVER_MAXCONN: "${PROXY_WHITELIST_SERVER_MAXCONN:-32}"
      API_QUEUE_TIMEOUT: "${API_QUEUE_TIMEOUT:-5s}"
      HIVEMIND_AGENT_INTER: "${HIVEMIND_AGENT_INTER:-5s}"
      # Crawler budget on the hivesense frontend (haproxy/30-proxies.cfg):
      # crawler User-Agents share one request-rate counter, 429 above it; 0 disables.
      HIVESENSE_CRAWLER_REQS_PER_10S: "${HIVESENSE_CRAWLER_REQS_PER_10S:-30}"
      HIVESENSE_CRAWLER_UA_REGEX: "${HIVESENSE_CRAWLER_UA_REGEX:-(bot|crawler|spider|slurp|bingpreview|ahrefs|yandex|baidu|semrush|petal|bytespider|gptbot|claudebot|ccbot|facebookexternalhit)}"
      # Email alert configuration (optional)
      HAPROXY_EMAIL_TO: "${HAPROXY_EMAIL_TO:-}"
      HAPROXY_EMAIL_FROM: "${HAPROXY_EMAIL_FROM:-}"
      HAPROXY_EMAIL_LEVEL: "${HAPROXY_EMAIL_LEVEL:-}"
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME}"
    depends_on:
      haproxy-healthchecks:
        condition: service_started
      smtp-relay:
        condition: service_started
        required: false
    volumes:
      - type: bind
        source: ./haproxy/00-global.cfg
        target: /usr/local/etc/haproxy/00-global.cfg
        read_only: true
      - type: bind
        source: ./haproxy/10-defaults.cfg
        target: /usr/local/etc/haproxy/10-defaults.cfg
        read_only: true
      - type: bind
        source: ./haproxy/30-proxies.cfg
        target: /usr/local/etc/haproxy/30-proxies.cfg
        read_only: true
      - type: bind
        source: ./haproxy/35-ollama.cfg
        target: /usr/local/etc/haproxy/35-ollama.cfg
        read_only: true
      - type: bind
        source: ${HAF_DATA_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}}/logs/haproxy
        target: /var/log/haproxy
    networks:
      - haf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 --spider http://127.0.0.1:8001/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    # Command removed - let entrypoint script handle it
  haproxy-healthchecks:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/haproxy-healthchecks:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    environment:
      POSTGRES_URL: postgresql://haf_admin@pgbouncer:6432/haf_block_log
      POSTGRES_URL_HAFBE: postgresql://hafbe_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_BTRACKER: postgresql://btracker_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_REPTRACKER: postgresql://reptracker_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_HIVESENSE: postgresql://hivesense_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_NFTTRACKER: postgresql://nfttracker_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_HIVEMIND: postgresql://hivemind_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_HAFAH: postgresql://hafah_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_HAF_STATS: postgresql://haf_stats_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_HAF_FYP: postgresql://haf_fyp_user@pgbouncer:6432/haf_block_log
      POSTGRES_URL_PROXY_WHITELIST: postgresql://proxy_whitelist_user@pgbouncer:6432/haf_block_log
      EXPECTED_BLOCK_TIME: "${EXPECTED_BLOCK_TIME:-}"
      # Agent-check liveness probes: each app's postgrest admin server (/live
      # needs no pool connection). Sync age is read over SQL as the app's role,
      # via the POSTGRES_URL_* above (see checks/check_http_sync_age.sh).
      HIVEMIND_LIVE_URL: "${HIVEMIND_LIVE_URL:-http://hivemind-postgrest-server:3001/live}"
      HAFAH_LIVE_URL: "${HAFAH_LIVE_URL:-http://hafah-postgrest:3001/live}"
      REPTRACKER_LIVE_URL: "${REPTRACKER_LIVE_URL:-http://reputation-tracker-postgrest:3001/live}"
      HAFBE_LIVE_URL: "${HAFBE_LIVE_URL:-http://block-explorer-postgrest:3001/live}"
      HIVESENSE_LIVE_URL: "${HIVESENSE_LIVE_URL:-http://hivesense-postgrest:3001/live}"
      BTRACKER_LIVE_URL: "${BTRACKER_LIVE_URL:-http://balance-tracker-postgrest:3001/live}"
      NFTTRACKER_LIVE_URL: "${NFTTRACKER_LIVE_URL:-http://nft-tracker-postgrest:3001/live}"
      HAF_STATS_LIVE_URL: "${HAF_STATS_LIVE_URL:-http://haf-stats-postgrest:3001/live}"
      HAF_FYP_LIVE_URL: "${HAF_FYP_LIVE_URL:-http://haf-fyp-postgrest:3001/live}"
      PROXY_WHITELIST_LIVE_URL: "${PROXY_WHITELIST_LIVE_URL:-http://proxy-whitelist-postgrest:3001/live}"
      # balance_tracker's app schema, part of the search_path its sync-status
      # function runs under (same default as balance_tracker.yaml)
      BTRACKER_SCHEMA: "${BTRACKER_SCHEMA:-hafbe_bal}"
      HTTP_CHECK_TIMEOUT: "${HTTP_CHECK_TIMEOUT:-5}"
      PSQL_CHECK_TIMEOUT: "${PSQL_CHECK_TIMEOUT:-5}"
      # Load-shed configuration (see healthchecks/checks/shed_poller.sh).
      # SHED_ARMED=false (the default) is log-only: overload is detected and
      # logged, but the agent responses always report the normal maxconn.
      SHED_ARMED: "${SHED_ARMED:-false}"
      SHED_POLL_INTERVAL: "${SHED_POLL_INTERVAL:-5}"
      SHED_CONFIRMATIONS: "${SHED_CONFIRMATIONS:-2}"
      SHED_COOLDOWN: "${SHED_COOLDOWN:-3}"
      SHED_OVERLOAD_ACTIVE: "${SHED_OVERLOAD_ACTIVE:-8}"
      SHED_OVERLOAD_AGE_S: "${SHED_OVERLOAD_AGE_S:-2}"
      SHED_OVERLOAD_TOTAL_ACTIVE: "${SHED_OVERLOAD_TOTAL_ACTIVE:-25}"
      # pgbouncer admin view for the pool-saturation signal ("stats" is a
      # read-only stats_users entry; with the default auth_type=trust no
      # password is needed. Under PGBOUNCER_AUTH_TYPE=md5, add stats:<pass>
      # to PGBOUNCER_USERS_WITH_PASSWORDS and put the password in this URL,
      # or set it empty to disable the pgbouncer signal.)
      POSTGRES_URL_PGBOUNCER: "${POSTGRES_URL_PGBOUNCER:-postgresql://stats@pgbouncer:6432/pgbouncer}"
      # Per-app "normal reduced floor" maxconn triples reported by the agent
      # checks. "normal" should match the *_SERVER_MAXCONN static caps on the
      # haproxy service; floor is never 0, so shedding can't cause an outage.
      HIVEMIND_SHED_MAXCONNS: "${HIVEMIND_SHED_MAXCONNS:-64 12 6}"
      HAFAH_SHED_MAXCONNS: "${HAFAH_SHED_MAXCONNS:-48 10 5}"
      HAFBE_SHED_MAXCONNS: "${HAFBE_SHED_MAXCONNS:-32 8 4}"
      BTRACKER_SHED_MAXCONNS: "${BTRACKER_SHED_MAXCONNS:-32 8 4}"
      REPTRACKER_SHED_MAXCONNS: "${REPTRACKER_SHED_MAXCONNS:-32 8 4}"
      HIVESENSE_SHED_MAXCONNS: "${HIVESENSE_SHED_MAXCONNS:-32 8 4}"
      NFTTRACKER_SHED_MAXCONNS: "${NFTTRACKER_SHED_MAXCONNS:-32 8 4}"
      HAF_STATS_SHED_MAXCONNS: "${HAF_STATS_SHED_MAXCONNS:-32 8 4}"
      HAF_FYP_SHED_MAXCONNS: "${HAF_FYP_SHED_MAXCONNS:-32 8 4}"
      PROXY_WHITELIST_SHED_MAXCONNS: "${PROXY_WHITELIST_SHED_MAXCONNS:-32 8 4}"
      # Pool-metric caps (see pool_cap_up in checks/shed_functions.sh): each
      # agent sizes its backend's maxconn from the app postgrest's /metrics.
      # POOL_CAP_MODE=log (the default) computes and logs the cap (on change,
      # pressure, or every POOL_CAP_LOG_EVERY s) but advertises what the agent
      # did before; "on" advertises it.
      POOL_CAP_MODE: "${POOL_CAP_MODE:-log}"
      POOL_CAP_FACTOR: "${POOL_CAP_FACTOR:-1.5}"
      POOL_CAP_CONFIRMATIONS: "${POOL_CAP_CONFIRMATIONS:-2}"
      POOL_CAP_COOLDOWN: "${POOL_CAP_COOLDOWN:-3}"
      POOL_CAP_LOG_EVERY: "${POOL_CAP_LOG_EVERY:-300}"
      HIVEMIND_METRICS_URL: "${HIVEMIND_METRICS_URL:-http://hivemind-postgrest-server:3001/metrics}"
      HAFAH_METRICS_URL: "${HAFAH_METRICS_URL:-http://hafah-postgrest:3001/metrics}"
      REPTRACKER_METRICS_URL: "${REPTRACKER_METRICS_URL:-http://reputation-tracker-postgrest:3001/metrics}"
      HAFBE_METRICS_URL: "${HAFBE_METRICS_URL:-http://block-explorer-postgrest:3001/metrics}"
      HIVESENSE_METRICS_URL: "${HIVESENSE_METRICS_URL:-http://hivesense-postgrest:3001/metrics}"
      BTRACKER_METRICS_URL: "${BTRACKER_METRICS_URL:-http://balance-tracker-postgrest:3001/metrics}"
      NFTTRACKER_METRICS_URL: "${NFTTRACKER_METRICS_URL:-http://nft-tracker-postgrest:3001/metrics}"
      HAF_STATS_METRICS_URL: "${HAF_STATS_METRICS_URL:-http://haf-stats-postgrest:3001/metrics}"
      HAF_FYP_METRICS_URL: "${HAF_FYP_METRICS_URL:-http://haf-fyp-postgrest:3001/metrics}"
      PROXY_WHITELIST_METRICS_URL: "${PROXY_WHITELIST_METRICS_URL:-http://proxy-whitelist-postgrest:3001/metrics}"
      # The fail-open cap when /metrics can't be read: the same static caps as
      # the haproxy service above.
      HIVEMIND_SERVER_MAXCONN: "${HIVEMIND_SERVER_MAXCONN:-64}"
      HAFAH_SERVER_MAXCONN: "${HAFAH_SERVER_MAXCONN:-48}"
      BALANCE_TRACKER_SERVER_MAXCONN: "${BALANCE_TRACKER_SERVER_MAXCONN:-32}"
      BLOCK_EXPLORER_SERVER_MAXCONN: "${BLOCK_EXPLORER_SERVER_MAXCONN:-32}"
      REPUTATION_TRACKER_SERVER_MAXCONN: "${REPUTATION_TRACKER_SERVER_MAXCONN:-32}"
      HIVESENSE_SERVER_MAXCONN: "${HIVESENSE_SERVER_MAXCONN:-32}"
      NFT_TRACKER_SERVER_MAXCONN: "${NFT_TRACKER_SERVER_MAXCONN:-32}"
      HAF_STATS_SERVER_MAXCONN: "${HAF_STATS_SERVER_MAXCONN:-32}"
      HAF_FYP_SERVER_MAXCONN: "${HAF_FYP_SERVER_MAXCONN:-32}"
      PROXY_WHITELIST_SERVER_MAXCONN: "${PROXY_WHITELIST_SERVER_MAXCONN:-32}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck_healthcheck.sh || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    profiles:
      - servers
      - haproxy-healthchecks
    networks:
      - haf-network
  smtp-relay:
    profiles:
      - email
    image: grafana/smtprelay:v2.4.0
    environment:
      # SMTP configuration must be provided when using email profile
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_AUTH_TYPE: "${SMTP_AUTH_TYPE:-plain}"
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME}"
    command:
      - -hostname=${PUBLIC_HOSTNAME}
      - -listen=0.0.0.0:25
      - -allowed_nets=
      - -remote_host=${SMTP_HOST:-localhost}
      - -remote_user=${SMTP_USER:-}
      - -remote_pass=${SMTP_PASS:-}
      - -remote_auth=${SMTP_AUTH_TYPE:-plain}
    networks:
      - haf-network
