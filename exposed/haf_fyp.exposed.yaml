services:
  haf-fyp-postgrest-rewriter:
    ports:
      - "${HAF_API_NODE_EXPOSED_IPADDR:-0.0.0.0}:${HAF_API_NODE_EXPOSED_PORT_PREFIX:-1}7017:80"
  # The write API (haf-fyp-api) is deliberately not exposed here: it accepts writes and
  # its per-client rate limiting depends on a header only the edge sets. Reach it via
  # /haf-fyp-admin/, or publish it in a local override.
