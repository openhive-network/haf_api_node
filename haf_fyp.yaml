# haf_fyp: a personalized "For You" feed (hive/haf_fyp). Block processing and the read
# API are the usual HAF-app shape; on top of that it runs a Python ranker that scores
# posts into a feed cache, a Redis for the ranker's wake-up signal and rate-limit
# counters, and a FastAPI write API (declared interests, feed telemetry, an admin call)
# routed separately at /haf-fyp-admin/.
#
# On its own `haf-fyp` profile rather than `apps`. haf_fyp publishes three images
# (haf_fyp/sql, haf_fyp/python, haf_fyp/postgrest-rewriter) and none is mirrored to
# registry.hive.blog yet, so set the HAF_FYP_* block in .env.example. Run with core:
#
#     docker compose --profile core --profile haf-fyp up -d
#
# hivemind and hivesense are soft dependencies: without them the app installs and syncs,
# but feeds come back empty while every health signal reads green. Cross-schema grants
# are also lost whenever hivemind recreates its views; re-run haf_fyp's
# scripts/grant_cross_schema.sh when /v1/fyp/global starts returning 401.
services:
  haf-fyp-install:
    image: ${HAF_FYP_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/sql}:${HAF_FYP_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-fyp
    environment:
      POSTGRES_HOST: haf
      # haf_admin: the install creates the app roles, so haf_fyp_owner does not exist
      # yet on a fresh node.
      POSTGRES_USER: haf_admin
      POSTGRES_DB: haf_block_log
    networks:
      haf-network:
    command:
      - install_app
      # No --swagger-url: haf_fyp hardcodes its OpenAPI `servers` entry to /haf-fyp-api
      # and ignores the flag (hive/haf_fyp#58). No --is_forking: the context is
      # non-forking and the installer only warns.
    depends_on:
      haf:
        condition: service_healthy
  # DESTRUCTIVE teardown: drops haf_fyp's schemas and roles CASCADE. The uninstall
  # refuses while any session is connected as a haf_fyp role, and pgbouncer holds pooled
  # haf_fyp_user backends for PGBOUNCER_SERVER_IDLE_TIMEOUT after postgrest stops, so:
  #
  #     docker compose stop haf-fyp-block-processing haf-fyp-ranker haf-fyp-api \
  #                         haf-fyp-postgrest pgbouncer
  #     docker compose --profile core --profile haf-fyp-uninstall up haf-fyp-uninstall
  #
  # `up <service>`, not `run --rm`: pg_hba (haf_base.yaml) is keyed by container name and
  # a `run` container's name matches no row. `--profile core` because this depends on haf.
  haf-fyp-uninstall:
    image: ${HAF_FYP_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/sql}:${HAF_FYP_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-fyp-uninstall
    environment:
      POSTGRES_HOST: haf
      # haf_admin: dropping the app roles needs CREATEROLE, and a role cannot drop itself.
      POSTGRES_USER: haf_admin
      POSTGRES_DB: haf_block_log
    networks:
      haf-network:
    command:
      - uninstall_app
      - --force
    depends_on:
      haf:
        condition: service_healthy
  haf-fyp-block-processing:
    image: ${HAF_FYP_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/sql}:${HAF_FYP_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-fyp
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_owner
      POSTGRES_DB: haf_block_log
      # The container healthcheck passes if the loop iterated within this window or the
      # app is in sync. Nothing routes on it; chain staleness is measured by the
      # agent-check on 7017.
      HAF_FYP_HEALTHCHECK_MAX_AGE_SECONDS: ${HAF_FYP_HEALTHCHECK_MAX_AGE_SECONDS:-300}
    networks:
      haf-network:
    restart: on-failure
    command:
      - process_blocks
    healthcheck:
      test: ["CMD-SHELL","/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      # 72h, as in haf_fyp's own compose: a from-genesis build of its candidate tables
      # runs longer than haf_stats' 48h.
      start_period: 72h
    depends_on:
      haf:
        condition: service_healthy
      haf-fyp-install:
        condition: service_completed_successfully
  # The ranker scores candidates and writes the feed cache on a schedule, plus on demand
  # when the API publishes a refresh on Redis. It connects directly to haf, not through
  # pgbouncer, because it holds long transactions with autocommit off across cycles. It
  # serves nothing and has no health signal: if it dies, feeds go stale rather than down.
  haf-fyp-ranker:
    image: ${HAF_FYP_PYTHON_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/python}:${HAF_FYP_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-fyp
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_owner
      POSTGRES_DB: haf_block_log
      REDIS_HOST: haf-fyp-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://haf-fyp-redis:6379
    networks:
      haf-network:
    restart: unless-stopped
    # The python image sets no CMD, so both Python services spell out the command.
    command: ["python", "-m", "haf_fyp.ranker_daemon"]
    depends_on:
      haf:
        condition: service_healthy
      haf-fyp-install:
        condition: service_completed_successfully
      haf-fyp-redis:
        condition: service_healthy
  # The write API, served at /haf-fyp-admin/ (HAProxy 7018). Despite the prefix only
  # /v1/fyp/admin/* is admin: POST/DELETE /v1/fyp/interests (posting-key signed) and
  # POST /v1/fyp/events (unauthenticated telemetry) are what a front-end calls. It is
  # routed separately from the read API so a stale feed takes only reads out.
  #
  # Its /metrics reports internal database topology, so haproxy/30-proxies.cfg denies it
  # on the public route; monitoring can reach haf-fyp-api:3002/metrics on the app
  # network. Connects directly to haf (long-lived psycopg pool), so it has its own
  # pg_hba row.
  #
  # No swagger labels: the app serves /docs and /openapi.json only when
  # HAF_FYP_ENABLE_DOCS is set, so there is nothing for a status-page row to link to.
  haf-fyp-api:
    image: ${HAF_FYP_PYTHON_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/python}:${HAF_FYP_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-fyp
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_user
      POSTGRES_DB: haf_block_log
      REDIS_HOST: haf-fyp-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://haf-fyp-redis:6379
      # Empty rejects every admin call. Set a long random value to enable them.
      ADMIN_API_KEY: ${HAF_FYP_ADMIN_API_KEY:-}
      # Addresses whose X-Real-IP the app trusts for per-client rate limiting; Caddy sets
      # that header on this route. Use the compose network's CIDR. Left empty, every
      # caller shares one rate-limit bucket.
      TRUSTED_PROXY_IPS: ${HAF_FYP_TRUSTED_PROXY_IPS:-}
      # Verifies posting-key signatures on interest writes; must be a trusted hived.
      HIVE_RPC_URL: ${HAF_FYP_HIVE_RPC_URL:-http://haf:8091}
      HAF_FYP_ENABLE_DOCS: ${HAF_FYP_ENABLE_DOCS:-}
    networks:
      haf-network:
    restart: unless-stopped
    # --root-path so the served OpenAPI describes the public prefix Varnish strips.
    command: ["uvicorn", "haf_fyp.api:app", "--host", "0.0.0.0", "--port", "3002",
              "--root-path", "/haf-fyp-admin"]
    healthcheck:
      # python, not wget: python:3.11-slim ships neither wget nor curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=2).status == 200 else 1)\" 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m
    depends_on:
      haf:
        condition: service_healthy
      haf-fyp-install:
        condition: service_completed_successfully
      haf-fyp-redis:
        # service_healthy: the app connects to Redis at import time.
        condition: service_healthy
  haf-fyp-postgrest:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/postgrest:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    # See note in hivemind.yaml — host containerd may default to nofile=1024
    # soft, which postgrest can exhaust silently under load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    profiles:
      - haf-fyp
    environment:
      PGRST_SERVER_HOST: "::"
      PGRST_ADMIN_SERVER_PORT: 3001
      # No `options=-c statement_timeout=...` on the URI: pgbouncer rejects that startup
      # parameter. See haf_stats.yaml.
      PGRST_DB_URI: postgresql://haf_fyp_user@pgbouncer:6432/haf_block_log?application_name=haf_fyp_postgrest
      PGRST_DB_SCHEMA: haf_fyp_endpoints
      PGRST_DB_ANON_ROLE: haf_fyp_user
      # 8 rather than haf_fyp's own 20: pgbouncer multiplexes behind this.
      PGRST_DB_POOL: 8
      PGRST_DB_ROOT_SPEC: root
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_LOG_LEVEL: ${HAF_FYP_SERVER_LOG_LEVEL:-error}
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:3001/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    networks:
      haf-network:
    depends_on:
      # Gated on the install (which creates the schemas), not on block-processing, whose
      # 72h start_period would otherwise keep the API down for the length of a replay.
      haf-fyp-install:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  haf-fyp-postgrest-rewriter:
    image: ${HAF_FYP_REWRITER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/postgrest-rewriter}:${HAF_FYP_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-fyp
    labels:
      # for Swagger UI
      - "io.hive.swagger.url=/haf-fyp-api/"
      - "io.hive.swagger.name=HAF FYP API"
      - "io.hive.swagger.order=10"
      - "io.hive.healthcheck.port=7017"
    environment:
      # nginx resolves the upstream at config-parse time, so a wrong name makes the
      # container exit immediately rather than 502. Restart the rewriter after anything
      # that recreates haf-fyp-postgrest.
      POSTGREST_HOST: haf-fyp-postgrest
      POSTGREST_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    depends_on:
      haf-fyp-postgrest:
        condition: service_healthy
    networks:
      - haf-network
  # Named haf-fyp-redis because jussi.yaml already defines a service called `redis`, and
  # a duplicate service name across included files merges or errors depending on the
  # Compose version. Holds only rate-limit counters and the ranker's pub/sub channel, so
  # no volume. Unauthenticated, like everything else on the app network.
  haf-fyp-redis:
    image: redis:7-alpine
    profiles:
      - haf-fyp
    command: redis-server --maxmemory-policy noeviction
    networks:
      haf-network:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
