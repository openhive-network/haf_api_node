services:
  hivesense-sync:
    image: ${HIVESENSE_SYNCER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense/syncer}:${HIVESENSE_SYNCER_VERSION:-${HIVESENSE_VERSION:-${HIVE_API_NODE_VERSION}}}
    profiles:
      - hivesense
      - apps
    environment:
      POSTGRES_URI: postgresql://hivesense_owner@haf/haf_block_log?application_name=hivesense_sync
      HIVESENSE_API: ${HIVESENSE_SYNC_API:-https://api.hive.blog/hivesense-api}
      LOG_LEVEL: ${HIVESENSE_SYNC_LOG_LEVEL:-INFO} # one of DEBUG, INFO, WARNING, ERROR
      # what to do when upstream has embeddings for a post that doesn't exist in the
      # local hivemind database (a sign of an inconsistent/corrupted hivemind):
      #   skip - drop the op and keep syncing (the post will never have embeddings here)
      #   exit - stop the syncer (container restart-loops) until hivemind is repaired,
      #          e.g. by restoring a known-good snapshot
      MISSING_POST_ACTION: ${HIVESENSE_MISSING_POST_ACTION:-skip}
      # how many times (1s apart) to re-check hivemind for a missing post before
      # applying MISSING_POST_ACTION
      MISSING_POST_RETRIES: ${HIVESENSE_MISSING_POST_RETRIES:-30}
      # log kept in the datadir (survives compose down; rotated by the logrotate service)
      LOG_FILE: /logs/hivesense_sync.log
    volumes:
      - type: bind
        source: ${HAF_LOG_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}/logs}/apps
        target: /logs
    init: true
    networks:
      haf-network:
    depends_on:
      haf:
        condition: service_healthy
      hivesense-install-schema:
        condition: service_completed_successfully
