# haf_stats: network and account analytics (hive/haf_stats). On its own `haf-stats`
# profile rather than `apps` until registry.hive.blog carries a haf_stats tag matching
# HIVE_API_NODE_VERSION; until then set HAF_STATS_IMAGE/HAF_STATS_REWRITER_IMAGE/
# HAF_STATS_VERSION (see .env.example).
services:
  haf-stats-install:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats
    environment:
      POSTGRES_HOST: haf
      # haf_admin: the install creates the app roles, so haf_stats_owner does not exist
      # yet on a fresh node (and has no pg_hba row for this container anyway).
      POSTGRES_USER: haf_admin
      # The install asserts the operation-type registry matches the chain and exits
      # non-zero on a mismatch, which keeps block-processing and postgrest from starting.
      # Set this to 1 in .env to start anyway.
      HAF_STATS_SKIP_OP_TYPE_ASSERT: ${HAF_STATS_SKIP_OP_TYPE_ASSERT:-0}
    networks:
      haf-network:
    command:
      - install_app
      # Relative path, not ${PUBLIC_HOSTNAME}: haf_stats patches the OpenAPI `servers`
      # entry with this, and the app is served under this prefix whatever the hostname.
      - --swagger-url=/haf-stats-api
    depends_on:
      haf:
        condition: service_healthy
  # DESTRUCTIVE teardown: drops all haf_stats schemas CASCADE. The uninstall refuses while
  # any session is connected as a haf_stats role, and pgbouncer holds pooled
  # haf_stats_user backends for PGBOUNCER_SERVER_IDLE_TIMEOUT after postgrest stops, so:
  #
  #     docker compose stop haf-stats-block-processing haf-stats-postgrest pgbouncer
  #     docker compose --profile core --profile haf-stats-uninstall up haf-stats-uninstall
  #
  # `up <service>`, not `run --rm`: pg_hba (haf_base.yaml) is keyed by container name and
  # a `run` container's name matches no row. `--profile core` because this depends on haf.
  haf-stats-uninstall:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats-uninstall
    environment:
      POSTGRES_HOST: haf
      # haf_admin: dropping the app roles needs CREATEROLE, and a role cannot drop itself.
      POSTGRES_USER: haf_admin
    networks:
      haf-network:
    command:
      - uninstall_app
      - --force
    depends_on:
      haf:
        condition: service_healthy
  haf-stats-block-processing:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_stats_owner
      # The container healthcheck passes if the loop iterated within this window or the
      # app is in sync. Raise it if a massive-sync batch runs longer than this. Nothing
      # routes on it; chain staleness is measured by the agent-check on 7016.
      HAF_STATS_HEALTHCHECK_MAX_AGE_SECONDS: ${HAF_STATS_HEALTHCHECK_MAX_AGE_SECONDS:-300}
    networks:
      haf-network:
    restart: on-failure
    command:
      - process_blocks
    healthcheck:
      test: ["CMD-SHELL","/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h
    depends_on:
      haf:
        condition: service_healthy
      haf-stats-install:
        condition: service_completed_successfully
  haf-stats-postgrest:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/postgrest:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    # See note in hivemind.yaml — host containerd may default to nofile=1024
    # soft, which postgrest can exhaust silently under load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    profiles:
      - haf-stats
    environment:
      PGRST_SERVER_HOST: "::"
      PGRST_ADMIN_SERVER_PORT: 3001
      # No `options=-c statement_timeout=...` on the URI (haf_stats' own compose has one):
      # pgbouncer rejects that startup parameter and postgrest would never connect. A
      # statement timeout for this app has to be set at the role level by its installer.
      PGRST_DB_URI: postgresql://haf_stats_user@pgbouncer:6432/haf_block_log?application_name=haf_stats_postgrest
      PGRST_DB_SCHEMA: haf_stats_endpoints
      PGRST_DB_ANON_ROLE: haf_stats_user
      PGRST_DB_POOL: 8
      PGRST_DB_ROOT_SPEC: root
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_DB_EXTRA_SEARCH_PATH: haf_stats_app
      PGRST_LOG_LEVEL: ${HAF_STATS_SERVER_LOG_LEVEL:-error}
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:3001/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    networks:
      haf-network:
    depends_on:
      # Gated on the install (which creates the schemas), not on block-processing, whose
      # 48h start_period would otherwise keep the API down for the length of a replay.
      haf-stats-install:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  haf-stats-postgrest-rewriter:
    image: ${HAF_STATS_REWRITER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats/postgrest-rewriter}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats
    labels:
      # for Swagger UI
      - "io.hive.swagger.url=/haf-stats-api/"
      - "io.hive.swagger.name=HAF Stats API"
      - "io.hive.swagger.order=9"
      - "io.hive.healthcheck.port=7016"
    environment:
      # The image's entrypoint defaults this to the service name in haf_stats' own
      # compose file, and nginx resolves the upstream at config-parse time, so a wrong
      # name makes the container exit immediately rather than 502.
      POSTGREST_HOST: haf-stats-postgrest
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    depends_on:
      haf-stats-postgrest:
        condition: service_healthy
    networks:
      - haf-network
