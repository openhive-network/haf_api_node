# haf_stats. Gated on its own `haf-stats` profile rather than `apps` until
# hive/haf_stats#66 lands: CI currently publishes only commit-SHA tags, so the
# conventional ${HIVE_API_NODE_VERSION} default does not resolve to a real image.
# Once tagging exists, move these services into `apps` alongside the others.
services:
  haf-stats-install:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats
    environment:
      POSTGRES_HOST: haf
      # REQUIRED, unlike some siblings. install_app.sh's step 1 loads db/builtin_roles.sql,
      # which CREATEs both app roles -- and haf_stats' scripts/common.sh defaults
      # POSTGRES_USER to haf_stats_owner, a role that does not exist yet on a fresh node.
      # (uninstall_app.sh self-defaults to haf_admin; install_app.sh does not.) Without
      # this the install connects as haf_stats_owner, for which haf_base.yaml has no
      # pg_hba row on this container: FATAL: no pg_hba.conf entry for host ..., user
      # "haf_stats_owner". (Authentication runs before the role lookup, so that is the
      # error you get here; on a stack with a permissive pg_hba the same slip surfaces
      # as `role "haf_stats_owner" does not exist`, since step 1 is what creates it.)
      POSTGRES_USER: haf_admin
      # install_app.sh asserts the operation-type registry matches the chain and
      # exits NON-ZERO on a mismatch -- deliberately not `|| true`. No sibling app
      # has such a gate, and this service is a service_completed_successfully
      # dependency for both block-processing and postgrest, so a tripped arm takes
      # the whole app down. The escape hatch has to be reachable from compose:
      # haf_stats' README prescribes `compose run --rm -e HAF_STATS_SKIP_OP_TYPE_ASSERT=1
      # haf-stats-setup` as the escape hatch, and names adding the variable to the
      # service's `environment:` as the better fix. Only the second works here: pg_hba on
      # this node is keyed per container name, and a `run` container's name matches no
      # row. (The README says nothing about pg_hba -- that constraint is this repo's.)
      HAF_STATS_SKIP_OP_TYPE_ASSERT: ${HAF_STATS_SKIP_OP_TYPE_ASSERT:-0}
    networks:
      haf-network:
    command:
      - install_app
      - --swagger-url=${PUBLIC_HOSTNAME}
    depends_on:
      haf:
        condition: service_healthy
  # Teardown. DESTRUCTIVE and has no undo -- it drops all three schemas CASCADE,
  # including haf_stats_backend, whose rollups take hours to rebuild from a genesis
  # replay. Run it deliberately and never as part of a normal up:
  #
  # Stop the app first -- uninstall_app.sh refuses while sessions are connected as a
  # haf_stats role. The block processor's connection never idles out, and pooled
  # haf_stats_user backends survive up to PGBOUNCER_SERVER_IDLE_TIMEOUT (600s) after
  # postgrest stops, so either wait it out or restart pgbouncer:
  #
  #     docker compose stop haf-stats-block-processing haf-stats-postgrest pgbouncer
  #
  # pgbouncer is in that list and the rewriter is not, which looks backwards and is
  # not. The rewriter is an nginx proxy and holds no database session at all. pgbouncer
  # holds server-side connections authenticated AS haf_stats_user -- its `[databases]`
  # line carries no `user=`, which is exactly why this MR had to add a haf_stats_user
  # pg_hba row for it. Stopping PostgREST closes only the client half; the pooled
  # backends linger in pg_stat_activity for PGBOUNCER_SERVER_IDLE_TIMEOUT (600s).
  # Skip pgbouncer and the teardown refuses for up to ten minutes, naming
  # application_name=haf_stats_postgrest -- a container you already stopped.
  # (Stopping pgbouncer briefly interrupts every app's PostgREST; they reconnect.)
  #     docker compose --profile core --profile haf-stats-uninstall \
  #                    up haf-stats-uninstall
  #
  # `up <service>`, NOT `run --rm`. haf_stats' README prescribes `run --rm` and is right
  # THERE: its own compose profiles nothing, so `up` would also start haf-stats-setup
  # (whose command is install_app) alongside the teardown, and it grants
  # `host haf_block_log haf_stats_owner all trust`, so an ad-hoc container connects.
  # Neither holds here. Upstream profiles every app service, so `up <service>` starts
  # only that one -- and pg_hba is keyed per CONTAINER NAME, where `run` names its
  # container <project>-haf-stats-uninstall-run-<slug>, matching no row in haf_base.yaml.
  # The recipes are not interchangeable.
  #
  # --profile core is required: this service depends on `haf`, and haf is not in
  # this profile, so without core the project fails to validate ("depends on
  # undefined service haf"). Six of the seven sibling uninstall services behave the
  # same way; block-explorer-uninstall is the exception -- and it is the exception
  # because it uses the idiom rejected just below.
  #
  # Adding haf-stats-uninstall to `haf`'s own profile list -- the idiom haf uses for
  # block-explorer-uninstall -- would make the extra flag unnecessary, and was tried
  # and REJECTED: it also removes a guard. With haf in the profile, `--profile
  # haf-stats-uninstall up -d`, service name omitted, VALIDATES and runs the
  # teardown. For nft-tracker that one-token slip fails closed. Costing an operator
  # one flag is worth keeping a destructive command fail-closed.
  haf-stats-uninstall:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats-uninstall
    environment:
      POSTGRES_HOST: haf
      # haf_admin, not haf_stats_owner: the teardown drops roles, which needs CREATEROLE
      # plus the ADMIN option on each, and a role cannot drop itself. The script refuses
      # up front rather than discovering this after the schemas are gone.
      POSTGRES_USER: haf_admin
    networks:
      haf-network:
    command:
      - uninstall_app
      - --force
    depends_on:
      haf:
        condition: service_healthy
  haf-stats-block-processing:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_stats_owner
      # The in-image check is
      #     (last_active_at fresher than this AND later than this container's start)
      #     OR hive.is_app_in_sync(context)
      # so this window only binds while the app is BEHIND -- at the tip the OR arm
      # reports healthy whatever this is set to. Raise it when a MASSIVE-mode batch runs
      # longer than the window and reports unhealthy on a healthy replay; note the
      # one-iteration lag means 300s tolerates iterations of roughly half that.
      #
      # Cosmetic in this stack: nothing gates on this health, and !243 does NOT change
      # that -- its agent-check measures a different quantity (get_app_current_block_age
      # over HTTP /sync-status, with its own 60s threshold) and never reads container
      # health or this variable. It matters for `docker ps` and for whoever reads it.
      HAF_STATS_HEALTHCHECK_MAX_AGE_SECONDS: ${HAF_STATS_HEALTHCHECK_MAX_AGE_SECONDS:-300}
      # No LOG_FILE / /logs bind-mount, unlike balance_tracker. That pattern was copied
      # here and then removed: `git grep LOG_FILE` in hive/haf_stats returns nothing, so
      # the variable was inert and the mount stayed empty -- an operator following the
      # comment to find logs after an incident would have found an empty directory.
      # Container stdout is captured instead; see log_rotation/haf_stats.log_rotation.yaml.
    networks:
      haf-network:
    restart: on-failure
    command:
      - process_blocks
    healthcheck:
      # In-image, and it connects as this service's own POSTGRES_USER. The obvious
      # alternative -- psql -U haf_stats_user -c 'SELECT 1' -- proves only that
      # PostgreSQL answers, and on a node whose pg_hba does not admit that role it
      # cannot even do that: observed reporting unhealthy for two weeks while the app
      # sat at the chain tip.
      #
      # It reads hafd.contexts.last_active_at, so it proves the loop is ITERATING. It
      # does NOT prove the chain is advancing -- HAF commits that heartbeat before every
      # early return in app_next_iteration, so a paused app or a stopped hived still
      # ticks it. Chain staleness belongs to an agent-check -- but note that
      # healthchecks/checks/haf_stats.sh DOES NOT EXIST in this repo yet. !243 adds it;
      # until that merges nothing on a stock node measures haf_stats' chain lag.
      test: ["CMD-SHELL","/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h
    depends_on:
      haf:
        condition: service_healthy
      haf-stats-install:
        condition: service_completed_successfully
  haf-stats-postgrest:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/postgrest:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    # See note in hivemind.yaml — host containerd may default to nofile=1024
    # soft, which postgrest can exhaust silently under load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    profiles:
      - haf-stats
    environment:
      PGRST_SERVER_HOST: "::"
      PGRST_ADMIN_SERVER_PORT: 3001
      # statement_timeout is carried ON THE CONNECTION because that is the only place
      # it arms: haf_stats' README records that a function-level SET never takes effect
      # for PostgREST, and `ALTER ROLE ... SET statement_timeout` is dead config here.
      # It matters MORE in this file than in haf_stats' own compose, which is where the
      # 30s comes from: there PostgREST owns a private pool straight to haf:5432, so a
      # runaway query starves only haf_stats. Here the pool is pgbouncer's, shared with
      # every other app (DEFAULT_POOL_SIZE 25 / MAX_DB_CONNECTIONS 30), so an uncapped
      # query holds a slot the whole node competes for. No sibling sets one; that is a
      # gap in the siblings, not a licence to drop the cap the app ships with.
      PGRST_DB_URI: postgresql://haf_stats_user@pgbouncer:6432/haf_block_log?application_name=haf_stats_postgrest&options=-c%20statement_timeout%3D30s
      PGRST_DB_SCHEMA: haf_stats_endpoints
      PGRST_DB_ANON_ROLE: haf_stats_user
      PGRST_DB_POOL: 8
      PGRST_DB_ROOT_SPEC: root
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_DB_EXTRA_SEARCH_PATH: haf_stats_app
      PGRST_LOG_LEVEL: ${HAF_STATS_SERVER_LOG_LEVEL:-error}
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:3001/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    networks:
      haf-network:
    depends_on:
      # NOT gated on haf-stats-block-processing. Its healthcheck reports a committed
      # block-processing iteration, and with start_period: 48h a container that is
      # merely slow to start reports `starting`, so a health gate here would keep the
      # API down indefinitely. The install gate below is what guarantees the schemas
      # exist, which is the actual prerequisite. Matches every other app here.
      haf-stats-install:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  haf-stats-postgrest-rewriter:
    image: ${HAF_STATS_REWRITER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats/rewriter}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats
    labels:
      # for Swagger UI. status/app.js discards any container without swagger.url before
      # any health logic runs (`if (!swaggerUrl) continue;`), so these are what put
      # haf_stats on the status page at all -- healthcheck.port alone would do nothing.
      # They are added HERE, with the route, and deliberately not in !244: a swagger.url
      # pointing at a path nothing serves produces a status row whose link 404s.
      - "io.hive.swagger.url=/haf-stats-api/"
      - "io.hive.swagger.name=HAF Stats API"
      - "io.hive.swagger.order=9"
      - "io.hive.healthcheck.port=7016"
    environment:
      # REQUIRED. rewriter_entrypoint.sh defaults POSTGREST_HOST to `haf-stats-api`,
      # which is the service name in haf_stats' OWN docker/docker-compose.yml -- not
      # this one. The template renders `proxy_pass http://$POSTGREST_HOST:3000`, and
      # nginx resolves a literal upstream at CONFIG-PARSE time with no resolver
      # directive. So a name that does not exist is not a 502 at request time:
      # openresty exits immediately with [emerg] host not found in upstream. There
      # is no restart policy, so it stays exited and the port-81 healthcheck never
      # runs. haf_fyp's rewriter_entrypoint.sh documents this asymmetry and names
      # haf_stats as the counter-example.
      POSTGREST_HOST: haf-stats-postgrest
    # NO io.hive.swagger.* / io.hive.healthcheck.port labels yet, deliberately, and
    # they are NOT both unblocked by the same MR:
    #
    #   io.hive.healthcheck.port  waits on !243, which binds 7016.
    #   io.hive.swagger.url       waits on a Caddy/Varnish/HAProxy route for
    #                             /haf-stats-api/. NO MR PROVIDES THAT YET -- !243
    #                             adds only healthchecks/ plus two haproxy.yaml vars.
    #
    # status/app.js discards any container without io.hive.swagger.url before any
    # health logic runs (`if (!swaggerUrl) continue;`), so with neither label
    # haf_stats does not appear on the status page AT ALL -- it is not listed as
    # `unknown`. Shipping swagger.url alone would list it `unknown`; shipping both
    # while nothing binds 7016 would list it a permanent `unhealthy`. Adding
    # healthcheck.port alone changes nothing, because swagger.url is the gate.
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    depends_on:
      haf-stats-postgrest:
        condition: service_healthy
    networks:
      - haf-network
