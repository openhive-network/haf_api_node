services:
  haf-stats-install:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - apps
      - haf-stats
    environment:
      POSTGRES_HOST: haf
    networks:
      haf-network:
    command:
      - install_app
      - --swagger-url=${PUBLIC_HOSTNAME}
    depends_on:
      haf:
        condition: service_healthy
  haf-stats-uninstall:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - haf-stats-uninstall
    environment:
      POSTGRES_HOST: haf
      # haf_admin, not haf_stats_owner: the teardown drops roles, which needs CREATEROLE
      # plus the ADMIN option on each, and a role cannot drop itself. The script refuses
      # up front rather than discovering this after the schemas are gone.
      POSTGRES_USER: haf_admin
    networks:
      haf-network:
    command:
      - uninstall_app
      - --force
    depends_on:
      haf:
        condition: service_healthy
  haf-stats-block-processing:
    image: ${HAF_STATS_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - apps
      - haf-stats
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_stats_owner
      # block-processing log, kept in the datadir (survives compose down; rotated by the logrotate service)
      LOG_FILE: /logs/haf_stats_block_processing.log
    volumes:
      - type: bind
        source: ${HAF_LOG_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}/logs}/apps
        target: /logs
    networks:
      haf-network:
    restart: on-failure
    command:
      - process_blocks
    healthcheck:
      # In-image, and it connects as this service's own POSTGRES_USER. The obvious
      # alternative -- psql -U haf_stats_user -c 'SELECT 1' -- proves only that
      # PostgreSQL answers, and on a node whose pg_hba does not admit that role it
      # cannot even do that: observed reporting unhealthy for two weeks while the app
      # sat at the chain tip.
      #
      # It reads hafd.contexts.last_active_at, so it proves the loop is ITERATING. It
      # does NOT prove the chain is advancing -- HAF commits that heartbeat before every
      # early return in app_next_iteration, so a paused app or a stopped hived still
      # ticks it. Chain staleness is the agent-check's job (healthchecks/checks/haf_stats.sh).
      test: ["CMD-SHELL","/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h
    depends_on:
      haf:
        condition: service_healthy
      haf-stats-install:
        condition: service_completed_successfully
  haf-stats-postgrest:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/postgrest:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    # See note in hivemind.yaml — host containerd may default to nofile=1024
    # soft, which postgrest can exhaust silently under load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    profiles:
      - apps
      - haf-stats
    environment:
      PGRST_SERVER_HOST: "::"
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_URI: postgresql://haf_stats_user@pgbouncer:6432/haf_block_log?application_name=haf_stats_postgrest
      PGRST_DB_SCHEMA: haf_stats_endpoints
      PGRST_DB_ANON_ROLE: haf_stats_user
      PGRST_DB_POOL: 8
      PGRST_DB_ROOT_SPEC: root
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_DB_EXTRA_SEARCH_PATH: haf_stats_app
      PGRST_LOG_LEVEL: ${HAF_STATS_SERVER_LOG_LEVEL:-error}
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:3001/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    networks:
      haf-network:
    depends_on:
      # NOT gated on haf-stats-block-processing. Its healthcheck reports a committed
      # block-processing iteration, and with start_period: 48h a container that is
      # merely slow to start reports `starting`, so a health gate here would keep the
      # API down indefinitely. The install gate below is what guarantees the schemas
      # exist, which is the actual prerequisite. Matches every other app here.
      haf-stats-install:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  haf-stats-postgrest-rewriter:
    image: ${HAF_STATS_REWRITER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_stats/rewriter}:${HAF_STATS_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - apps
      - haf-stats
    labels:
      # for Swagger UI
      - "io.hive.swagger.url=/haf-stats-api/"
      - "io.hive.swagger.name=HAF Stats API"
      - "io.hive.swagger.order=20"
      - "io.hive.healthcheck.port=7016"
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    depends_on:
      haf-stats-postgrest:
        condition: service_healthy
    networks:
      - haf-network
