services:
  hivesense-block-processing:
    image: ${HIVESENSE_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense}:${HIVESENSE_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - hivesense
      - apps
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: hivesense_owner
      # log kept in the datadir (survives compose down; rotated by the logrotate service)
      LOG_FILE: /logs/hivesense.log
    volumes:
      - type: bind
        source: ${HAF_LOG_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}/logs}/apps
        target: /logs
    command: >
      process_blocks ${HIVESENSE_SYNC_ARGS:-}
    networks:
      haf-network:
    healthcheck:
      test: ["CMD-SHELL","/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h
    depends_on:
      haf:
        condition: service_healthy
      hivesense-install-schema:
        condition: service_completed_successfully
