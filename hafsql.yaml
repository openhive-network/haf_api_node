services:
  hafsql:
    profiles:
      - hafsql
    image: ${HAFSQL_IMAGE:-mahdiyari/hafsql}:${HAFSQL_VERSION:-2.7.4}
    restart: on-failure
    networks:
      - haf-network
    tty: true
    stdin_open: true
    environment:
      HAFSQL_PGHOST: haf
      HAFSQL_PUBLICUSER: true
      HAFSQL_PUBLICUSERNAME: ${HAFSQL_PUBLIC_USERNAME:-hafsql_public}
      HAFSQL_PUBLICPASSWORD: ${HAFSQL_PUBLIC_PASSWORD:-hafsql_public}
      HAFSQL_PUBLIC_STATEMENT_TIMEOUT: ${HAFSQL_PUBLIC_STATEMENT_TIMEOUT:-15s}
      HAFSQL_PUBLIC_WORK_MEM: ${HAFSQL_PUBLIC_WORK_MEM:-}
      HAFSQL_PUBLIC_TEMP_FILE_LIMIT: ${HAFSQL_PUBLIC_TEMP_FILE_LIMIT:-256MB}
      API_PREFIX: /hafsql
    # HafSQL 2.7 reads hafbe_bal.*, hafbe_app.*, reptracker_app.* and hivemind_app.*,
    # so the block explorer (apps/hafbe profile), hivemind and reputation tracker are required
    depends_on:
      block-explorer-install-balance-tracker:
        condition: service_completed_successfully
        required: true
      block-explorer-install-schema:
        condition: service_completed_successfully
      haf:
        condition: service_healthy
      hivemind-install:
        condition: service_completed_successfully
      reputation-tracker-install:
        condition: service_completed_successfully
    labels:
      # for Swagger UI
      - "io.hive.swagger.url=/hafsql/openapi.json"
      - "io.hive.swagger.name=HafSQL"
      - "io.hive.swagger.order=7"

  hafsql-uninstall:
    profiles:
      - hafsql-uninstall
    image: ${HAFSQL_IMAGE:-mahdiyari/hafsql}:${HAFSQL_VERSION:-2.7.4}
    networks:
      - haf-network
    tty: true
    stdin_open: true
    stop_grace_period: 10m
    command: purge
    environment:
      HAFSQL_PGHOST: haf
    depends_on:
      haf:
        condition: service_healthy
