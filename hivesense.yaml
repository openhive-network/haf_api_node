services:
  # run an ollama instance to compute vector embeddings.  
  # Without editing this config, your ollama instance will run entirely on CPU.
  # This is fine for embedding the query strings necessary for handling a low-to-moderate
  # volume of search API calls, but you will need GPU acceleration if you want to 
  # generate embeddings for posts.
  #
  # By default, we use a stripped-down ollama image that's fine for CPU embedding.
  # If you're using a GPU, you will likely need to switch to the official ollama image,
  # by setting OLLAMA_IMAGE=ollama/ollama in the .env file
  hivesense-ollama:
    image: ${OLLAMA_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense/ollama}:${OLLAMA_VERSION:-0.18.0}
    # Set HIVESENSE_OLLAMA_REPLICAS=0 to disable the local ollama entirely
    # (e.g. when embeddings are served by a remote OpenAI-compatible pool with
    # the hivesense-llama-cpu service as local fallback -- see .env.example).
    deploy:
      replicas: ${HIVESENSE_OLLAMA_REPLICAS:-1}
    profiles:
      - hivesense
      - apps
      - ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=16
      - OLLAMA_NUM_THREADS=16
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MODELS=/tmp/ollama
    tty: true
    networks:
      haf-network:
    volumes:
      - type: bind
        source: ${HAF_DATA_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}}/hivesense/ollama
        target: /tmp/ollama
    entrypoint: /bin/sh
    command: >
      -c "
        ollama serve &

        until ollama list > /dev/null 2>&1; do
          echo 'Waiting for ollama to start...'
          sleep 1
        done

        echo 'Pulling model...'
        ollama pull \${HIVESENSE_MODEL:-hf.co/jinaai/jina-embeddings-v5-text-small-retrieval:F16}
        echo 'Ready.'

        wait
      "
    # uncomment for nvidia:
    ### runtime: nvidia
    # or uncomment for amd:
    ### image: ollama/ollama:0.7.0-rc1-rocm
    ### environment:
    ###  - HIP_VISIBLE_DEVICES=0
    ### devices:
    ###  - /dev/kfd
    ###  - /dev/dri
    ### group_add:
    ###  - video
  # Optional local CPU embedding server speaking the OpenAI protocol
  # (/v1/embeddings), for use as a fallback when embeddings are normally served
  # by a remote OpenAI-compatible GPU pool (HIVESENSE_EMBEDDING_API=openai).
  # Disabled by default: enable by adding "hivesense-llama-cpu" to
  # COMPOSE_PROFILES and routing to it from a HAProxy override (see
  # haproxy/35-ollama-remote.cfg.example). The model is downloaded from
  # HuggingFace on first start and cached on the bind mount, mirroring the
  # hivesense-ollama pull-on-start behaviour.
  hivesense-llama-cpu:
    image: ${HIVESENSE_LLAMA_CPU_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${HIVESENSE_LLAMA_CPU_VERSION:-server}
    profiles:
      - hivesense-llama-cpu
    environment:
      - LLAMA_CACHE=/models
    command: >
      -hf ${HIVESENSE_LLAMA_CPU_MODEL:-jinaai/jina-embeddings-v5-text-small-retrieval:F16}
      --embeddings
      -c ${HIVESENSE_LLAMA_CPU_CTX:-8192} -b 8192 -ub 8192
      --host 0.0.0.0 --port 8080
    networks:
      haf-network:
    volumes:
      - type: bind
        source: ${HAF_DATA_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}}/hivesense/llama-cpu
        target: /models
  hivesense-install-schema:
    image: ${HIVESENSE_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense}:${HIVESENSE_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - hivesense
      - apps
      - hivesense-install
    environment:
      POSTGRES_HOST: haf
    command:
      - install_app
      - "--llm=${HIVESENSE_MODEL:-hf.co/jinaai/jina-embeddings-v5-text-small-retrieval:F16}"
      - "--vector_size=${HIVESENSE_VECTOR_SIZE:-1024}"
      - "--ollama=${HIVESENSE_OLLAMA:-http://haproxy:7012}"
      - "--embedding-api=${HIVESENSE_EMBEDDING_API:-ollama}"
      - "--start_block=${HIVESENSE_START_BLOCK:-1}"
      - "--parallel_workers=${HIVESENSE_WORKERS:-16}"
      - "--embedding_batch_size=${HIVESENSE_EMBEDDING_BATCH_SIZE:-50}"
      - "--tokenizer-model=${HIVESENSE_TOKENIZER_MODEL_NAME:-jina-v5-small}"
      - "--tokens_per_chunk=${HIVESENSE_TOKENS_PER_CHUNK:-2048}"
      - "--overlap_amount=${HIVESENSE_OVERLAP_AMOUNT:-0.10}"
      - "--use-halfvec-index=${HIVESENSE_USE_HALFVEC_INDEX:-TRUE}"
      - "--store-halfvec-embeddings=${HIVESENSE_STORE_HALFVEC_EMBEDDINGS:-TRUE}"
      - "--document-prefix=${HIVESENSE_DOCUMENT_PREFIX-Document: }"
      - "--query-prefix=${HIVESENSE_QUERY_PREFIX-Query: }"
      - "--min-token-threshold=${HIVESENSE_MIN_TOKEN_THRESHOLD:-75}"
      - "--min-token-search-threshold=${HIVESENSE_MIN_TOKEN_SEARCH_THRESHOLD:-0}"
      - "--swagger-url=${PUBLIC_HOSTNAME}/"
      - "--use-reduced-embeddings=${HIVESENSE_USE_REDUCED_EMBEDDINGS:-true}"
      - "--reduced-matrix-source=${HIVESENSE_MATRIX_SOURCE:-https://gitlab.syncad.com/hive/hivesense/-/wikis/uploads/0eebabf30d7cceb5776cb62c41abb2c9/projection_matrix_768_128_20250722.json.gz}"
      - "--config-dir=/hivesense/config"
      - "--reduced-dim=${HIVESENSE_REDUCED_DIMENSION:-128}"
      - "--reduction-mode=${HIVESENSE_REDUCTION_MODE:-slice}"
      - "--hnsw-m=${HIVESENSE_HNSW_M:-16}"
      - "--hnsw-ef-construction=${HIVESENSE_HNSW_EF_CONSTRUCTION:-200}"
      - "--maintenance-work-mem=${HIVESENSE_MAINTENANCE_WORK_MEM:-28}"
      - "--num-ctx=${HIVESENSE_NUM_CTX:-8192}"
    volumes:
      - type: bind
        source: ${HAF_DATA_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}}/hivesense/config
        target: /hivesense/config
    networks:
      haf-network:
    depends_on:
      haf:
        condition: service_healthy
      hivemind-install:
        condition: service_completed_successfully
  # to uninstall Hivesense, shut down the stack and run a command like:
  #   docker compose --profile core --profile block-explorer-uninstall up -d
  hivesense-uninstall:
    image: ${HIVESENSE_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense}:${HIVESENSE_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - hivesense-uninstall
    environment:
      POSTGRES_HOST: haf
    command:
      - uninstall_app
    networks:
      haf-network:
    depends_on:
      haf:
        condition: service_healthy
  hivesense-postgrest-rewriter:
    image: ${HIVESENSE_REWRITER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense/postgrest-rewriter}:${HIVESENSE_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - hivesense
      - apps
    labels:
      # for Swagger UI
      - "io.hive.swagger.url=/hivesense-api/"
      - "io.hive.swagger.name=HiveSense"
      - "io.hive.swagger.order=4"
      - "io.hive.healthcheck.port=7011"
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    init: true
    depends_on:
      hivesense-postgrest:
        condition: service_healthy
    networks:
      - haf-network
  hivesense-postgrest:
    image: ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_api_node/postgrest:${HAF_API_NODE_VERSION:-${HIVE_API_NODE_VERSION}}
    # See note in hivemind.yaml — host containerd may default to nofile=1024
    # soft, which postgrest can exhaust silently under load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    profiles:
      - hivesense
      - apps
    environment:
      PGRST_SERVER_HOST: "::"
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_URI: postgresql://hivesense_user@pgbouncer:6432/haf_block_log?application_name=hivesense_postgrest
      PGRST_DB_SCHEMA: hivesense_endpoints
      PGRST_DB_ANON_ROLE: hivesense_user
      PGRST_DB_POOL: 6
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_DB_ROOT_SPEC: root
      PGRST_DB_EXTRA_SEARCH_PATH: hivesense_app
    networks:
      haf-network:
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:3001/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15m
    depends_on:
      hivesense-install-schema:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  hivesense-pca:
    image: ${HIVESENSE_SYNCER_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/hivesense/pca}:${HIVESENSE_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - hivesense-pca
    environment:
      POSTGRES_URI: postgresql://hivesense_owner@haf/haf_block_log?application_name=hivesense_pca
      #POSTGRES_URI: postgresql://hivesense_user@haf/haf_block_log?application_name=hivesense_pca
      SAMPLE_SIZE: ${HIVESENSE_PCA_SAMPLE_SIZE:-1000000}
      REDUCED_DIM: ${HIVESENSE_PCA_REDUCED_DIM:-128}
      PCA_MATRIX_PATH: output/pca_projection_matrix.npy
      BATCH_SIZE: 10000
    init: true
    tty: true
    stdin_open: true
    networks:
      haf-network:
        #command: ["python", "run_pca.py"]
        #command: ["python", "recall.py", "sample", "--num-queries", "100", "--output", "output/sample.json"]
        #command: ["python", "recall.py", "--table", "hivesense_app.posts_vectors", "search", "--topk", "20", "--queries", "output/sample.json", "--disable-index", "--parallel-workers", "16", "--output", "output/gt.json"]
    command: ["python", "recall.py", "--table", "hivesense_app.posts_vectors_reduced_128", "search", "--topk", "1000", "--queries", "output/sample.json", "--disable-index", "--parallel-workers", "16", "--output", "output/reduced_128.json"]
        #command: ["python", "recall.py", "analyze", "--gt", "output/gt.json", "--ann", "output/reduced_128.json", "-c", "25", "50", "75", "100", "500", "1000"]
        #command: ["python", "convert_embeddings.py", "--workers", "20"]
    volumes:
      - type: bind
        source: ${HAF_DATA_DIRECTORY:-${TOP_LEVEL_DATASET_MOUNTPOINT}}/hivesense/pca
        target: /app/output
    depends_on:
      haf:
        condition: service_healthy
      hivesense-install-schema:
        condition: service_completed_successfully
