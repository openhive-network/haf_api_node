global
  # Log backend up/down events to stdout (visible via docker logs)
  log stdout format raw local0 notice
  # Log to file for more detail (rotated by logrotate service)
  log /dev/log len 8192 format raw local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  ca-base /etc/ssl/certs
  presetenv SYNC_BROADCAST_BACKEND_SERVER api.hive.blog
  presetenv SYNC_BROADCAST_BACKEND_PORT 443
  presetenv SYNC_BROADCAST_BACKEND_SSL ssl
  # Per-server concurrency caps for the postgrest-backed backends. These are
  # generous static ceilings (several times each postgrest's PGRST_DB_POOL);
  # the agent checks can tighten them dynamically under measured overload via
  # "maxconn:" in their responses (see healthchecks/checks/shed_poller.sh).
  # Requests above the cap wait in the backend queue for at most
  # API_QUEUE_TIMEOUT, then shed with a fast 503 — bounding worst-case
  # latency instead of letting congestion collapse the database.
  presetenv HIVEMIND_SERVER_MAXCONN 64
  presetenv HAFAH_SERVER_MAXCONN 48
  presetenv BALANCE_TRACKER_SERVER_MAXCONN 32
  presetenv BLOCK_EXPLORER_SERVER_MAXCONN 32
  presetenv REPUTATION_TRACKER_SERVER_MAXCONN 32
  presetenv HIVESENSE_SERVER_MAXCONN 32
  presetenv NFT_TRACKER_SERVER_MAXCONN 32
  presetenv HAF_STATS_SERVER_MAXCONN 32
  presetenv PROXY_WHITELIST_SERVER_MAXCONN 32
  presetenv API_QUEUE_TIMEOUT 5s
  # hivemind is the usual overload victim, so its agent polls faster
  presetenv HIVEMIND_AGENT_INTER 5s
  # maxconn needs to be set to handle our maximum expected load.
  # Let's say we want to handle 10000 calls/second.
  # Most of our API calls will timeout after 3 seconds.  If we assume
  # the worst case, where all of the calls take the full 3 seconds, we
  # should expect 30000 calls in flight at any one time.  We'll round up
  # to 32768.  In reality, the vast majority of calls should be handled
  # in a few tens of milliseconds so this should be massive overkill.
  maxconn 32768

resolvers docker
  parse-resolv-conf
  timeout resolve 1s
  timeout retry   1s
  resolve_retries 1

  # Don’t cache negatives for long:
  hold nx       1s
  hold other    1s
  hold refused  1s
  hold timeout  1s
  hold valid    1s
