frontend stats
  bind *:8000
  stats enable
  stats uri /admin/haproxy/
  stats refresh 10s
  stats admin if TRUE
  # Prometheus metrics endpoint (HAProxy 2.x built-in exporter)
  http-request use-service prometheus-exporter if { path /metrics }
  no log

frontend health
  bind 127.0.0.1:8001
  mode http
  http-request return status 200 if { src 127.0.0.0/8 }
  no log

