# The write API, on its own port and backend. Splitting it from the read path is not
# tidiness: the two have different failure modes and must not share a health verdict.
frontend haf-fyp-admin-in-7018
  bind *:7018
  option http-server-close
  default_backend haf-fyp-admin

backend hived
  balance roundrobin
  server-template haf 1 haf:8090 check agent-check agent-addr haproxy-healthchecks agent-port 7001 agent-inter 10s

backend hived-http
  balance roundrobin
  server-template haf 1 haf:8091 check agent-check agent-addr haproxy-healthchecks agent-port 7001 agent-inter 10s

backend balance-tracker
  # balance first: identical to roundrobin with the single stock server, but
  # overflows to any secondary/spillover servers a deployment adds (see
  # 30-proxies-spillover.cfg.example) once this one hits its maxconn.
  balance first
  # /sync-status is the uniform HAF-app health endpoint (requires app
  # images that ship it, 2026-08 develop+)
  option httpchk
  http-check connect
  http-check send meth GET uri /sync-status
  http-check expect status 200
  timeout check 100
  timeout queue "$API_QUEUE_TIMEOUT"
  server-template balance-tracker 1 balance-tracker-postgrest-rewriter:80 maxconn "$BALANCE_TRACKER_SERVER_MAXCONN" check agent-check agent-addr haproxy-healthchecks agent-port 7004 agent-inter 10s

backend reputation-tracker
