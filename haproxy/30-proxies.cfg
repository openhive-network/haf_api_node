# haf_stats. /sync-status is served by the rewriter (hive/haf_stats!72) and returns the
# uniform HAF shape, so the httpchk below matches every sibling exactly.
#
# The agent-check points at haproxy-healthchecks:7016, served by checks/haf_stats.sh
# (!243). A healthchecks image older than that (e.g. 1.28.6) binds nothing there, and that
# is SAFE -- HAProxy documents it outright under `agent-check`:
#
#   "Failure to connect to the agent is not considered an error as connectivity is
#    tested by the regular health check which is enabled by the "check" parameter."
#
# So on a node whose healthchecks image never had the check, the server state is whatever
# the httpchk on /sync-status says, and the agent contributes nothing. Going BACK to such
# an image is different: the same section warns that "only an agent reporting "up" will
# be able to turn the server up again", so a `down` sent before the swap is not cleared
# by the httpchk.
backend haf-stats
  balance first
  option httpchk
  http-check connect
  http-check send meth GET uri /sync-status
  http-check expect status 200
  timeout queue "$API_QUEUE_TIMEOUT"
  server-template haf-stats 1 haf-stats-postgrest-rewriter:80 maxconn "$HAF_STATS_SERVER_MAXCONN" check agent-check agent-addr haproxy-healthchecks agent-port 7016 agent-inter 10s

# haf_fyp's read API. Same shape as every sibling: an httpchk on /sync-status plus the
# agent-check on 7017, which is what reports chain staleness and the shed level.
backend haf-fyp
  balance first
  option httpchk
  http-check connect
  http-check send meth GET uri /sync-status
  http-check expect status 200
  timeout queue "$API_QUEUE_TIMEOUT"
  server-template haf-fyp 1 haf-fyp-postgrest-rewriter:80 maxconn "$HAF_FYP_SERVER_MAXCONN" check agent-check agent-addr haproxy-healthchecks agent-port 7017 agent-inter 10s

# haf_fyp's write API. NO agent-check, deliberately: the agent reports how old the last
# processed block is, and these endpoints -- interests, events, the key-gated admin
# calls -- do not depend on that. Gating them on sync age would refuse a user's write
# during a replay for no reason. Liveness is what matters here, so it is an httpchk on
# the app's own /health. It also means a stale feed takes the READ backend out while
# writes keep working, which is the behaviour we want.
backend haf-fyp-admin
  balance first
  option httpchk
  http-check connect
  http-check send meth GET uri /health
  http-check expect status 200
  # WHAT THIS CANNOT SEE: /health returns a constant -- {"status":"ok"} with no database,
  # redis or RPC round-trip -- so this backend stays UP while every write 5xx's on a dead
  # pool or an unreachable haf-fyp-redis. It is liveness, not readiness, and combined with
  # the deliberate absence of an agent-check and of a status-page row it leaves the write
  # surface with no failure signal on the node. /sync-status is NOT the fix: it answers
  # 503 for the days a massive sync takes, which would take writes down for exactly the
  # window this split exists to keep them up through. A deeper /health belongs in the app
  # and is filed as hive/haf_fyp#61.
  timeout queue "$API_QUEUE_TIMEOUT"
  # /metrics is unauthenticated on this app and reports internal database topology --
  # which sibling schemas are readable, feed-cache state, weeks of candidate volumes.
  # Varnish strips the /haf-fyp-admin prefix before this backend sees the path, so the
  # public request arrives here as /metrics. Denied rather than published; anything on
  # the app network can still reach haf-fyp-api:3002/metrics directly.
  #
  # `path,url_dec`, NOT `path`. The plain fetch matches the RAW path: HAProxy does not
  # percent-decode, every hop forwards the encoding untouched, and uvicorn decodes once
  # at the far end -- so `/haf-fyp-admin/%6Detrics` sailed past a `path -m beg /metrics`
  # rule and returned the live document. Verified end-to-end against a running node
  # before this line was corrected. One decode is enough: `%256D` becomes the literal
  # `%6D` here, and uvicorn's single decode then leaves a path that matches no route.
  #
  # An allowlist (deny unless the path is /v1/..., /health or /sync-status) was
  # considered and rejected: it would also block /docs and /openapi.json, which an
  # operator can deliberately enable with HAF_FYP_ENABLE_DOCS. The cost of this form is
  # that a future sensitive endpoint has to be added here by hand.
  http-request deny if { path,url_dec -i -m beg /metrics }
  server-template haf-fyp-admin 1 haf-fyp-api:3002 maxconn "$HAF_FYP_ADMIN_SERVER_MAXCONN" check

backend sync-hived
  balance roundrobin
  server-template sync-hived 1 "$SYNC_BROADCAST_BACKEND_SERVER":"$SYNC_BROADCAST_BACKEND_PORT" check "$SYNC_BROADCAST_BACKEND_SSL" ca-file ca-certificates.crt

backend hafsql
  server-template hafsql 1 hafsql:3000 check

backend proxy-whitelist
  balance first
  option httpchk
  http-check connect
  http-check send meth GET uri /sync-status
  http-check expect status 200
  timeout queue "$API_QUEUE_TIMEOUT"
  server-template proxy-whitelist 1 proxy-whitelist-postgrest-rewriter:80 maxconn "$PROXY_WHITELIST_SERVER_MAXCONN" check agent-check agent-addr haproxy-healthchecks agent-port 7015 agent-inter 10s

backend status
  balance roundrobin
  option httpchk
  http-check connect
  http-check send meth GET uri /health
  http-check expect status 200
  server-template status-api 1 status-api:3000 check agent-check agent-addr haproxy-healthchecks agent-port 7014 agent-inter 10s
