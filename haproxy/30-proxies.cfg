backend hivemind
  balance first
  # The rewriter's catch-all forwards everything to hivemind's JSON-RPC
  # handler in the database, so this cheap call round-trips the full
  # rewriter -> postgrest -> pgbouncer -> postgres path
  option httpchk
  http-check connect
  http-check send meth GET uri /sync-status
  http-check expect status 200
  timeout queue "$API_QUEUE_TIMEOUT"
  server-template hivemind 1 hivemind-postgrest-rewriter:80 maxconn "$HIVEMIND_SERVER_MAXCONN" check agent-check agent-addr haproxy-healthchecks agent-port 7002 agent-inter "$HIVEMIND_AGENT_INTER"

